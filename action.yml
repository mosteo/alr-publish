name: 'alr publish'
description: 'Publish using `alr publish`'
author: 'Alire Project'

inputs:
  github_token:
    description: 'GitHub token with permissions to fork and push'
    required: true
  user_email:
    description: 'Email address to use for commits'
    required: true
    default: ''
  directory:
    description: 'Directory containing the crate to publish'
    required: false
    default: .
  index_owner:
    description: 'Owner of the index to publish to'
    required: false
    default: alire-project
  index_name:
    description: 'Name of the index repository'
    required: false
    default: alire-index
  skip_build:
    description: 'Skip building the project'
    required: false
    default: false
  skip_submit:
    description: 'Skip submitting the release to the index (only generate manifest)'
    required: false
    default: false
  force:
    description: use `alr --force`
    required: false
    default: false
  clean:
    description: Whether to remove alr afterwards, if it wasn't originally installed
    required: false
    default: true

runs:
  using: "composite"
  steps:

    - name: Find alr in path
      id: find-alr
      shell: bash
      run: |
        # FIND ALR STEP
        which alr && echo "available=true" >> $GITHUB_OUTPUT || echo "available=false" >> $GITHUB_OUTPUT

    - name: Set up alr
      if: steps.find-alr.outputs.available != 'true'
      uses: alire-project/setup-alire@v4
      with:
        version: 2.1.0  # Necessary for the latest publish improvements

    - name: Prepare arguments
      shell: bash
      run: |
        # ARGUMENTS PREPARATION STEP
        if [[ "${{inputs.skip_build}}" != "false" ]]; then
          echo "skip_build=--skip-build" >> $GITHUB_ENV
        else
          echo "skip_build=" >> $GITHUB_ENV
        fi
        if [[ "${{inputs.skip_submit}}" != "false" ]]; then
          echo "skip_submit=--skip-submit" >> $GITHUB_ENV
        else
          echo "skip_submit=" >> $GITHUB_ENV
        fi
        if [[ "${{inputs.force}}" != "false" ]]; then
          echo "force=--force" >> $GITHUB_ENV
        else
          echo "force=" >> $GITHUB_ENV
        fi

    - name: Configure target index
      shell: bash
      run: |
        # INDEX CONFIGURATION STEP
        alr settings --global --set index.owner ${{inputs.index_owner}}
        alr settings --global --set index.repository_name ${{inputs.index_name}}
        echo "Configured index: https://github.com/${{inputs.index_owner}}/${{inputs.index_name}}"

    - name: Validate inputs
      shell: bash
      run: |
        # INPUT VALIDATION STEP
        echo "Running with user=${{github.actor}}"
        if [[ -z "${{inputs.github_token}}" ]]; then
          echo "::error::github_token input is required but not provided"
          exit 1
        fi

    - name: Validate version
      shell: bash
      run: |
        # VERSION VALIDATION STEP
        cd ${{inputs.directory}} && \
          $GITHUB_ACTION_PATH/scripts/validate_version.sh

    - name: Publish
      shell: bash
      env:
        GH_TOKEN: ${{inputs.github_token}}
        USER_EMAIL: ${{inputs.user_email}}
      run: |
        # PUBLISHING STEP
        cd ${{inputs.directory}} && \
          $GITHUB_ACTION_PATH/scripts/publish.sh

    - name: Cleanup
      if: inputs.clean == 'true' && steps.find-alr.outputs.available != 'true'
      shell: bash
      run: |
        # CLEANUP STEP
        rm -rf alire_install
